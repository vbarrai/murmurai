name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # The macOS-only and native dependencies (rumps, Quartz, AVFoundation,
      # faster-whisper, sounddevice, …) are not installable on Linux and are
      # stubbed by tests/conftest.py, so only pytest itself is needed here.
      # `--no-project` skips installing the project (whose mac-only deps won't
      # build on Linux) and `python -m pytest` puts the repo root on sys.path so
      # `import murmurai` still resolves. The interpreter comes from
      # .python-version.
      - name: Run tests
        run: uv run --no-project --with pytest python -m pytest
